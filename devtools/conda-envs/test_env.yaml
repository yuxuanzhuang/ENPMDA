name: enpmda-test
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip

  # Runtime dependencies
  - numpy>=1.23
  - pandas>=1.5
  - scikit-learn>=1.3
  - dask>=2024.1.0
  - distributed>=2024.1.0
  - bokeh==2.4.2
  - tqdm>=4.65

  # MDAnalysis (pulls from PyPI/git via pip, see pip: section)
  - pip

  # Testing
  - pytest>=8.3
  - pytest-xdist>=3.6
  - coverage>=7.6
  - tox>=4.18

  # Linting & formatting
  - flake8>=7.1
  - black>=24.8
  - pylint

  # Documentation
  - sphinx>=7.3
  - sphinx_rtd_theme

  # Build & packaging
  - setuptools>=70
  - wheel>=0.42
  - twine>=5.1
  - bump2version>=1.0

  # File watching (optional for dev reloads)
  - watchdog>=4.0

  - pip:
      # faster wrapping version of MDAnalysis
      - mdanalysis @ git+https://github.com/yuxuanzhuang/mdanalysis@main#subdirectory=package&egg=opt_serialization