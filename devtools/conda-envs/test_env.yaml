name: enpmda-test
channels:
  - conda-forge

dependencies:
  # Let CI decide the Python version; setup-miniconda will inject it.
  - python
  - pip

  # Runtime
  - numpy>=1.23
  - pandas>=1.5
  - scikit-learn>=1.3
  - dask>=2024.1.0
  - distributed>=2024.1.0
  - bokeh>=3.3,<4
  - tqdm>=4.65

  # Testing
  - pytest>=8.3
  - pytest-xdist>=3.6
  - coverage>=7.6
  - tox>=4.18

  # Lint & format
  - flake8>=7.1
  - black>=24.8
  - pylint

  # Docs
  - sphinx>=7.3
  - sphinx_rtd_theme

  # Build & packaging
  - setuptools>=70
  - wheel>=0.42
  - twine>=5.1
  - bump2version>=1.0

  # Optional: file watching
  - watchdog>=4.0

  - pip:
      # Faster wrapping version of MDAnalysis (custom fork)
      - mdanalysis @ git+https://github.com/yuxuanzhuang/mdanalysis@main#subdirectory=package&egg=opt_serialization